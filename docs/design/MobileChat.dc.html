<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sourced chat in a mobile app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF0F3}
</style>
</helmet>
<div style="width: 960px; height: 960px; box-sizing: border-box; padding: 40px 60px; display: flex; gap: 60px; justify-content: center; align-items: flex-start; font-family: Inter, system-ui, sans-serif; color: #1B1E22; background: #EEF0F3">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 14px; align-items: center">
  <div style="width: 390px; height: 844px; border-radius: 48px; background: #FBFAF7; box-shadow: 0 0 0 10px #1B1E22, 0 24px 60px rgba(20, 22, 26, 0.25); overflow: hidden; display: flex; flex-direction: column; position: relative">
    <div style="height: 50px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px; font-size: 14px; font-weight: 600; background: {{brand}}; color: #FFFFFF"><span>9:41</span><span aria-hidden="true">●●● ▮</span></div>
    <header style="background: {{brand}}; color: #FFFFFF; padding: 8px 12px 14px; display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: none; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 600; font-size: 17px">Ask the handbook</span>
        <span style="font-size: 12px; opacity: 0.9">Brightleaf · answers with sources</span>
      </div>
    </header>

    <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
      <div style="align-self: flex-end; max-width: 82%; background: {{brand}}; color: #FFFFFF; padding: 11px 14px; border-radius: 16px 16px 4px 16px; font-size: 15px; line-height: 1.45">What's the hotel limit in New York?</div>
      <div style="max-width: 90%; background: #FFFFFF; border: 1px solid #ECE9E2; padding: 13px 14px; border-radius: 16px 16px 16px 4px; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; gap: 10px">
        <span>Up to <strong>$300 a night</strong> in New York or San Francisco. Everywhere else the limit is $220 <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; border-radius: 5px; background: {{brand}}; color: #FFFFFF; font-size: 11px; font-weight: 600">1</span></span>
        <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; border: none; background: #F2F0EA; color: #1B1E22; font: 13px Inter, sans-serif; text-align: left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
          <span style="flex: 1">Travel &amp; Expenses Policy · p. 10</span><span aria-hidden="true">›</span></button>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #2F6B57"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Checked against the source</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px">
        <button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9D5CC; background: #FFFFFF; font: 13px Inter, sans-serif; color: #1B1E22">How do I claim meals?</button>
        <button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9D5CC; background: #FFFFFF; font: 13px Inter, sans-serif; color: #1B1E22">Who approves travel?</button>
      </div>
    </div>

    <form aria-label="Ask a question" style="display: flex; gap: 8px; align-items: center; padding: 10px 12px 34px; border-top: 1px solid #ECE9E2; background: #FFFFFF">
      <label for="mq" style="position: absolute; left: -9999px">Question</label>
      <input id="mq" type="text" placeholder="Ask about policies…" style="flex: 1; min-width: 0; min-height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 23px; border: 1px solid #D9D5CC; font: 16px Inter, sans-serif; background: #FBFAF7">
      <button type="submit" aria-label="Send" style="width: 46px; height: 46px; border-radius: 50%; border: none; background: {{brand}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </form>
  </div>
  <figcaption style="font-size: 14px; color: #4A4F57">Chat screen inside the client's app</figcaption>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 14px; align-items: center">
  <div style="width: 390px; height: 844px; border-radius: 48px; background: #FBFAF7; box-shadow: 0 0 0 10px #1B1E22, 0 24px 60px rgba(20, 22, 26, 0.25); overflow: hidden; position: relative">
    <div style="position: absolute; inset: 0; background: rgba(20, 22, 26, 0.45)"></div>
    <section role="dialog" aria-label="Source 1" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 14px">
      <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9D5CC"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 600; color: {{brand}}; text-transform: uppercase; letter-spacing: 0.05em">Source 1</span>
          <span style="font-size: 17px; font-weight: 600">Travel &amp; Expenses Policy</span>
          <span style="font-size: 13px; color: #4A4F57">Page 10 · Hotels</span>
        </div>
        <button type="button" aria-label="Close source" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #F2F0EA; color: #1B1E22; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <blockquote style="margin: 0; padding: 12px 14px; border-left: 4px solid {{brand}}; background: #FFF4C2; border-radius: 0 10px 10px 0; font-size: 15px; line-height: 1.5">New York, San Francisco | Hotel limit per night — $300.</blockquote>
      <div aria-label="Page 10 preview" style="height: 300px; border: 1px solid #ECE9E2; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 9px; background: #FFFFFF">
        <div style="height: 10px; width: 45%; background: #DEDAD2; border-radius: 3px"></div>
        <div style="height: 7px; width: 92%; background: #ECE9E2; border-radius: 3px"></div>
        <div style="height: 7px; width: 85%; background: #ECE9E2; border-radius: 3px"></div>
        <div style="height: 7px; width: 70%; background: #ECE9E2; border-radius: 3px"></div>
        <div style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px">
          <div style="height: 16px; background: #E5E1D8; border-radius: 3px"></div><div style="height: 16px; background: #E5E1D8; border-radius: 3px"></div>
          <div style="height: 16px; background: #FFE27A; border-radius: 3px; outline: 2px solid #E0B400"></div><div style="height: 16px; background: #FFE27A; border-radius: 3px; outline: 2px solid #E0B400"></div>
          <div style="height: 16px; background: #F2F0EA; border-radius: 3px"></div><div style="height: 16px; background: #F2F0EA; border-radius: 3px"></div>
        </div>
        <div style="height: 7px; width: 88%; background: #ECE9E2; border-radius: 3px; margin-top: 10px"></div>
        <div style="height: 7px; width: 60%; background: #ECE9E2; border-radius: 3px"></div>
      </div>
      <button type="button" style="min-height: 50px; border-radius: 12px; border: none; background: {{brand}}; color: #FFFFFF; font: 600 15px Inter, sans-serif">Open page 10</button>
    </section>
  </div>
  <figcaption style="font-size: 14px; color: #4A4F57">Tapping a source opens the exact quote</figcaption>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#1F5C46","options":["#1F5C46","#2445A8","#7A2E8E","#B4410F"]},"$preview":{"width":960,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { brand: this.props.brand ?? '#1F5C46' };
  }
}
</script>
</body>
</html>
