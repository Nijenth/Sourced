name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Did anything besides documentation change?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Run every check unless this is a pull request that only touches documentation or deploy settings.
          code=true
          if [ "$EVENT" = "pull_request" ] && files=$(git diff --name-only "$BASE" HEAD); then
            code=false
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                *.md|docs/*|render.yaml|.env.example|frontend/screenshots/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code or tests changed: $code"

  backend:
    name: Engine and API tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fail instead of skipping when the Postgres tests can't start (the runner has Docker).
      SOURCED_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            backend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (engine, API, Postgres with pgvector in Docker)
        run: python -m pytest -q
      - name: Offline end-to-end evaluation
        run: python eval/run_eval.py --provider offline

  frontend:
    name: Dashboard tests and build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    name: Browser walkthroughs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      # GitHub's Ubuntu image already has Chrome's system libraries, so only the browser itself is needed,
      # and it's cached between runs. (Installing extra fonts with --with-deps was slow and flaky.)
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install chromium
        working-directory: frontend
      - name: Widget page events (stubbed API)
        run: npx playwright test widget-events.spec.ts
        working-directory: frontend
      - name: Dashboard keyboard walkthrough
        run: python -m frontend.e2e.run_live
      - name: Public website widget walkthrough
        run: python -m frontend.e2e.run_live --widgets
      - name: Signed-in widget and access-log walkthrough
        run: python -m frontend.e2e.run_live --signed-in
      - name: Streamlit demo shows untrusted text literally
        run: npx playwright test -c playwright.streamlit.config.ts
        working-directory: frontend
      - name: Keep Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  docker:
    name: Docker image
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (reusing cached layers from earlier runs)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sourced:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Write a test configuration (offline mode, no keys)
        run: |
          cat > .env <<'CONFIG'
          RAG_OFFLINE_MODE=1
          SOURCED_PREVIEW_SECRET=ci-only-preview-secret-0123456789abcdef
          SOURCED_DEMO_ADMIN_EMAIL=demo@example.com
          SOURCED_DEMO_ADMIN_PASSWORD=ci-only demo password
          SOURCED_ALLOW_SIGNUP=0
          CONFIG
      - name: Start (docker compose)
        run: docker compose up --detach --no-build --wait --wait-timeout 300
      - name: Smoke test the running system
        run: python3 deploy/smoke_test.py http://localhost:8000 240
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
